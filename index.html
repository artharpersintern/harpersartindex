
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Publisher Directory</title>

<style>
:root {
  --ink: #222;
  --muted: #777;
  --line: #dedede;
  --paper: #fff;
  --soft: #f7f7f7;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: Arial, Helvetica, sans-serif;
  font-size: 13px;
}

button, input, select { font: inherit; }
button { cursor: pointer; }

a {
  color: inherit;
  text-decoration: underline;
  text-underline-offset: 3px;
}

header {
  border-bottom: 1px solid var(--line);
  padding: 23px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
}

.logo {
  font-size: 20px;
  font-weight: 800;
  letter-spacing: -1px;
}

nav {
  display: flex;
  gap: 27px;
  flex-wrap: wrap;
}

nav a {
  text-decoration: none;
  color: var(--muted);
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: .7px;
}

nav a.active {
  color: var(--ink);
  font-weight: bold;
}

.layout {
  display: grid;
  grid-template-columns: 235px minmax(0, 1fr);
  min-height: calc(100vh - 75px);
}

aside {
  border-right: 1px solid var(--line);
  padding: 30px 22px;
}

.sidebar-title {
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  font-size: 11px;
  margin-bottom: 28px;
}

.filter-group {
  border-top: 1px solid var(--line);
  padding: 20px 0;
}

.filter-heading {
  font-weight: 700;
  margin-bottom: 15px;
}

.filter-options {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.filter-options label {
  display: flex;
  align-items: center;
  gap: 9px;
  cursor: pointer;
}

input[type="checkbox"] { accent-color: #222; }

.clear-button {
  background: transparent;
  border: 0;
  padding: 0;
  text-decoration: underline;
  color: var(--muted);
}

main {
  min-width: 0;
  padding: 32px 40px;
}

.page-title {
  font-size: 27px;
  letter-spacing: -.8px;
  margin: 0 0 9px;
}

.subtitle {
  color: var(--muted);
  margin-bottom: 28px;
}

.search {
  width: 100%;
  border: 1px solid var(--line);
  background: #fff;
  padding: 17px 18px;
  font-size: 15px;
  outline: none;
}

.search:focus { border-color: #555; }

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  flex-wrap: wrap;
  padding: 20px 0 14px;
}

.count { color: var(--muted); }

.toolbar-actions {
  display: flex;
  align-items: center;
  gap: 10px;
}

.toolbar button,
.toolbar select {
  background: white;
  border: 1px solid var(--line);
  padding: 9px 12px;
}

.table-wrap { overflow-x: auto; }

table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
}

th {
  text-align: left;
  text-transform: uppercase;
  letter-spacing: .6px;
  font-size: 10px;
  color: var(--muted);
  padding: 15px 12px;
  border-bottom: 1px solid var(--ink);
}

td {
  padding: 17px 12px;
  border-bottom: 1px solid var(--line);
  vertical-align: top;
  overflow-wrap: anywhere;
}

tbody tr:hover { background: var(--soft); }

.publisher-name { font-weight: 700; }

.size-tag {
  display: inline-block;
  padding: 4px 8px;
  border: 1px solid var(--line);
  font-size: 11px;
  text-transform: capitalize;
}

.details-row { background: var(--soft); }
.details-row td { padding: 22px; }

.details-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0,1fr));
  gap: 20px;
}

.detail-label {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: .7px;
  color: var(--muted);
  margin-bottom: 7px;
}

.expand-button {
  border: 0;
  background: transparent;
  font-size: 17px;
}

.empty {
  padding: 45px;
  text-align: center;
  color: var(--muted);
}

@media(max-width:800px) {
  header { padding: 20px; flex-wrap: wrap; }
  .layout { grid-template-columns: 1fr; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); }
  main { padding: 25px 18px; }
  table { min-width: 700px; }
  .details-grid { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<header>
  <div class="logo">DIRECTORY</div>
  <nav>
    <a href="#" class="active">Publishers</a>
    <a href="#">Artists</a>
    <a href="#">Agencies</a>
    <a href="#">Publications</a>
  </nav>
</header>

<div class="layout">

<aside>
  <div class="sidebar-title">Filters</div>

  <div class="filter-group">
    <div class="filter-heading">Publication Size</div>
    <div class="filter-options">
      <label><input type="checkbox" class="size-filter" value="small"> Small</label>
      <label><input type="checkbox" class="size-filter" value="medium"> Medium</label>
      <label><input type="checkbox" class="size-filter" value="large"> Large</label>
      <label><input type="checkbox" class="size-filter" value="unknown"> Unknown</label>
    </div>
  </div>

  <div class="filter-group">
    <div class="filter-heading">Location</div>
    <div id="locationFilters" class="filter-options"></div>
  </div>

  <div class="filter-group">
    <div class="filter-heading">Specialty</div>
    <div id="specialtyFilters" class="filter-options"></div>
  </div>

  <button class="clear-button" id="clearFilters">Clear all filters</button>
</aside>

<main>
  <h1 class="page-title">Publishers</h1>
  <div class="subtitle">An independent directory of photography and art publishers.</div>

  <input
    type="search"
    id="searchInput"
    class="search"
    placeholder="Search publishers, locations, specialties..."
  >

  <div class="toolbar">
    <div class="count" id="resultCount">Loading publishers...</div>

    <div class="toolbar-actions">
      <button id="expandAll">Expand all</button>

      <select id="sortSelect" aria-label="Sort publishers">
        <option value="az">Name: A–Z</option>
        <option value="za">Name: Z–A</option>
        <option value="size-asc">Size: Small to Large</option>
        <option value="size-desc">Size: Large to Small</option>
      </select>
    </div>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th style="width:29%">Publisher</th>
          <th style="width:25%">Location</th>
          <th style="width:17%">Size</th>
          <th style="width:23%">Specialty</th>
          <th style="width:6%"></th>
        </tr>
      </thead>
      <tbody id="publisherTable"></tbody>
    </table>
  </div>

  <div class="empty" id="emptyMessage" hidden>No publishers match your filters.</div>
</main>

</div>

<script>
const CSV_FILE = "publishers_with_size.csv";

let publishers = [];
let expanded = new Set();
let expandAll = false;

const searchInput = document.getElementById("searchInput");
const tableBody = document.getElementById("publisherTable");
const resultCount = document.getElementById("resultCount");
const sortSelect = document.getElementById("sortSelect");
const emptyMessage = document.getElementById("emptyMessage");

function parseCSV(text) {
  const rows = [];
  let row = [];
  let value = "";
  let quoted = false;

  text = text.replace(/^\uFEFF/, "");

  for (let i = 0; i < text.length; i++) {
    const c = text[i];

    if (c === '"') {
      if (quoted && text[i + 1] === '"') {
        value += '"';
        i++;
      } else {
        quoted = !quoted;
      }
    } else if (c === "," && !quoted) {
      row.push(value);
      value = "";
    } else if ((c === "\n" || c === "\r") && !quoted) {
      if (c === "\r" && text[i + 1] === "\n") i++;
      row.push(value);
      if (row.some(x => x.trim())) rows.push(row);
      row = [];
      value = "";
    } else {
      value += c;
    }
  }

  row.push(value);
  if (row.some(x => x.trim())) rows.push(row);

  const headers = rows.shift().map(x => x.trim());

  return rows.map(values => {
    const obj = {};
    headers.forEach((header, i) => {
      obj[header] = (values[i] || "").trim();
    });
    return obj;
  });
}

function normalizeSize(value) {
  const size = (value || "").trim().toLowerCase();
  return ["small", "medium", "large"].includes(size)
    ? size
    : "unknown";
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);
}

function safeURL(value) {
  const url = String(value || "").trim();
  if (!url) return "";

  try {
    const parsed = new URL(
      /^https?:\/\//i.test(url) ? url : "https://" + url
    );
    return ["http:", "https:"].includes(parsed.protocol)
      ? parsed.href
      : "";
  } catch {
    return "";
  }
}

function createFilters(id, values, field) {
  const container = document.getElementById(id);
  container.innerHTML = "";

  [...new Set(values.filter(Boolean))]
    .sort((a,b) => a.localeCompare(b))
    .forEach(value => {
      const label = document.createElement("label");
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.value = value;
      checkbox.dataset.field = field;
      checkbox.addEventListener("change", render);

      label.append(checkbox, document.createTextNode(" " + value));
      container.appendChild(label);
    });
}

function selectedValues(selector) {
  return [...document.querySelectorAll(selector + ":checked")]
    .map(input => input.value);
}

function matchesMultiValue(value, selected) {
  if (!selected.length) return true;

  const parts = String(value || "")
    .split(/[;,]/)
    .map(s => s.trim().toLowerCase());

  return selected.some(s => parts.includes(s.toLowerCase()));
}

function getFilteredPublishers() {
  const query = searchInput.value.trim().toLowerCase();
  const sizes = selectedValues(".size-filter");
  const locations = selectedValues(
    '#locationFilters input[type="checkbox"]'
  );
  const specialties = selectedValues(
    '#specialtyFilters input[type="checkbox"]'
  );

  let results = publishers.filter(p => {
    const searchable = Object.values(p).join(" ").toLowerCase();

    if (query && !searchable.includes(query)) return false;

    if (sizes.length && !sizes.includes(normalizeSize(p.Size))) {
      return false;
    }

    if (!matchesMultiValue(p.Location, locations)) return false;
    if (!matchesMultiValue(p.Specialty, specialties)) return false;

    return true;
  });

  const order = { small: 0, medium: 1, large: 2, unknown: 3 };

  results.sort((a,b) => {
    const mode = sortSelect.value;

    if (mode === "za") {
      return b.Name.localeCompare(a.Name);
    }

    if (mode === "size-asc") {
      return order[normalizeSize(a.Size)] -
        order[normalizeSize(b.Size)] ||
        a.Name.localeCompare(b.Name);
    }

    if (mode === "size-desc") {
      const reverse = { large: 0, medium: 1, small: 2, unknown: 3 };
      return reverse[normalizeSize(a.Size)] -
        reverse[normalizeSize(b.Size)] ||
        a.Name.localeCompare(b.Name);
    }

    return a.Name.localeCompare(b.Name);
  });

  return results;
}

function detail(label, value, isLink = false) {
  if (!value) return "";

  let content = escapeHTML(value);

  if (isLink) {
    const url = safeURL(value);
    if (url) {
      content = `<a href="${escapeHTML(url)}"
        target="_blank" rel="noopener noreferrer">
        ${escapeHTML(value)}</a>`;
    }
  }

  return `<div>
    <div class="detail-label">${escapeHTML(label)}</div>
    <div>${content}</div>
  </div>`;
}

function render() {
  const results = getFilteredPublishers();

  resultCount.textContent =
    `${results.length} of ${publishers.length} publishers`;

  tableBody.innerHTML = "";
  emptyMessage.hidden = results.length !== 0;

  results.forEach(p => {
    const key = p._id;
    const isExpanded = expandAll || expanded.has(key);
    const size = normalizeSize(p.Size);

    const row = document.createElement("tr");

    row.innerHTML = `
      <td class="publisher-name">${escapeHTML(p.Name)}</td>
      <td>${escapeHTML(p.Location)}</td>
      <td><span class="size-tag">${escapeHTML(size)}</span></td>
      <td>${escapeHTML(p.Specialty)}</td>
      <td>
        <button class="expand-button"
          aria-label="${isExpanded ? "Collapse" : "Expand"} details"
          aria-expanded="${isExpanded}">
          ${isExpanded ? "−" : "+"}
        </button>
      </td>
    `;

    row.querySelector("button").addEventListener("click", () => {
      if (expanded.has(key)) expanded.delete(key);
      else expanded.add(key);
      expandAll = false;
      document.getElementById("expandAll").textContent = "Expand all";
      render();
    });

    tableBody.appendChild(row);

    if (isExpanded) {
      const detailsRow = document.createElement("tr");
      detailsRow.className = "details-row";

      detailsRow.innerHTML = `
        <td colspan="5">
          <div class="details-grid">
            ${detail("Website", p.Website, true)}
            ${detail("Contact", p.Contact)}
            ${detail("Description", p.Description)}
            ${detail("Tags", p.Tags)}
            ${detail("Notes", p.Notes)}
          </div>
        </td>
      `;

      tableBody.appendChild(detailsRow);
    }
  });
}

searchInput.addEventListener("input", render);
sortSelect.addEventListener("change", render);

document.querySelectorAll(".size-filter").forEach(input => {
  input.addEventListener("change", render);
});

document.getElementById("clearFilters").addEventListener("click", () => {
  document.querySelectorAll('input[type="checkbox"]')
    .forEach(input => input.checked = false);

  searchInput.value = "";
  render();
});

document.getElementById("expandAll").addEventListener("click", e => {
  expandAll = !expandAll;
  expanded.clear();
  e.target.textContent = expandAll ? "Collapse all" : "Expand all";
  render();
});

async function loadPublishers() {
  try {
    const response = await fetch(CSV_FILE, { cache: "no-store" });

    if (!response.ok) {
      throw new Error("Could not load " + CSV_FILE);
    }

    const csv = await response.text();

    publishers = parseCSV(csv)
      .filter(p => p.Name)
      .map((p, index) => ({ ...p, _id: index }));

    const locations = publishers.flatMap(p =>
      (p.Location || "").split(";").map(x => x.trim())
    );

    const specialties = publishers.flatMap(p =>
      (p.Specialty || "").split(";").map(x => x.trim())
    );

    createFilters("locationFilters", locations, "Location");
    createFilters("specialtyFilters", specialties, "Specialty");

    render();

  } catch (error) {
    console.error(error);
    resultCount.textContent = "Unable to load publishers";
    emptyMessage.hidden = false;
    emptyMessage.textContent =
      "Could not load the CSV. Check the filename and make sure the site is running through a web server.";
  }
}

loadPublishers();
</script>

</body>
</html>
