
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harper's Art Index</title>

<style>
:root {
  --paper: #faf8f3;
  --ink: #171717;
  --muted: #68655f;
  --line: #c8c4bd;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: Georgia, "Times New Roman", serif;
}

button, input, select {
  font: inherit;
}

button { cursor: pointer; }

header {
  padding: 28px 4% 0;
}

.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 35px;
  border-bottom: 1px solid var(--ink);
  padding-bottom: 26px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 25px;
  white-space: nowrap;
}

.logo {
  font-size: 33px;
  font-weight: bold;
  letter-spacing: -1.5px;
}

.brand-divider {
  height: 38px;
  border-left: 1px solid var(--ink);
}

.brand-subtitle {
  font-size: 29px;
  font-style: italic;
}

nav {
  display: flex;
  gap: 27px;
  flex-wrap: wrap;
}

nav button {
  border: 0;
  border-bottom: 2px solid transparent;
  background: transparent;
  padding: 12px 0;
  font-size: 16px;
}

nav button.active {
  border-bottom-color: var(--ink);
}

.layout {
  display: grid;
  grid-template-columns: 235px minmax(0, 1fr);
  gap: 45px;
  padding: 65px 4%;
  max-width: 1800px;
  margin: auto;
}

aside {
  border-right: 1px solid var(--line);
  padding-right: 30px;
}

aside h2 {
  font-size: 26px;
  font-weight: normal;
  margin: 0 0 25px;
}

.filter-group {
  border-top: 1px solid var(--line);
  padding: 22px 0;
}

.filter-group h3 {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
  margin: 0 0 17px;
}

.filter-option {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 12px 0;
  font-size: 15px;
  cursor: pointer;
}

.filter-option input {
  accent-color: var(--ink);
  width: 16px;
  height: 16px;
}

.clear-button {
  border: 1px solid var(--ink);
  background: transparent;
  padding: 10px 15px;
  width: 100%;
  font-size: 13px;
}

main {
  min-width: 0;
}

.search-box {
  display: flex;
  align-items: center;
  border: 1px solid var(--ink);
  padding: 0 22px;
  height: 72px;
  gap: 18px;
}

.search-icon {
  font-size: 30px;
}

.search-box input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: none;
  background: transparent;
  font-size: 22px;
  font-style: italic;
}

.results-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 38px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--line);
}

.results-bar select {
  border: 0;
  background: transparent;
  font-size: 15px;
}

.entry {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 170px 25px;
  gap: 25px;
  padding: 28px 0;
  border-bottom: 1px solid var(--line);
}

.entry h2 {
  font-size: 30px;
  font-weight: normal;
  margin: 0 0 8px;
}

.entry-type {
  text-transform: uppercase;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 1.5px;
  margin-bottom: 12px;
}

.entry-description {
  font-size: 16px;
  line-height: 1.5;
  max-width: 740px;
}

.entry-meta {
  font-size: 14px;
  line-height: 1.5;
}

.entry-meta em {
  display: block;
  margin-top: 10px;
  color: var(--muted);
}

.entry-link {
  color: var(--ink);
  font-size: 21px;
  text-decoration: none;
}

.entry-link:hover,
.entry h2 a:hover {
  opacity: .55;
}

.entry h2 a {
  color: inherit;
  text-decoration: none;
}

.empty {
  padding: 45px 0;
  color: var(--muted);
}

footer {
  padding: 30px 4%;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 13px;
}

@media (max-width: 1050px) {
  .header-inner {
    align-items: flex-start;
    flex-direction: column;
  }

  .layout {
    grid-template-columns: 190px minmax(0, 1fr);
    gap: 25px;
  }
}

@media (max-width: 700px) {
  .layout {
    display: block;
    padding-top: 35px;
  }

  aside {
    border-right: 0;
    border-bottom: 1px solid var(--line);
    padding: 0 0 20px;
    margin-bottom: 30px;
  }

  .filter-group {
    padding: 15px 0;
  }

  .entry {
    grid-template-columns: 1fr 25px;
  }

  .entry-meta {
    grid-column: 1;
    grid-row: 2;
  }

  .entry-link {
    grid-column: 2;
    grid-row: 1;
  }

  .search-box input {
    font-size: 16px;
  }

  .brand {
    gap: 12px;
  }

  .logo { font-size: 25px; }
  .brand-subtitle { font-size: 23px; }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="brand">
      <div class="logo">HARPER'S</div>
      <div class="brand-divider"></div>
      <div class="brand-subtitle">Art Index</div>
    </div>

    <nav id="navigation"></nav>

  </div>
</header>

<div class="layout">

  <aside>
    <h2>Filters</h2>

    <div class="filter-group">
      <h3>Specialty</h3>
      <div id="specialtyFilters"></div>
    </div>

    <div class="filter-group">
      <h3>Location</h3>
      <div id="locationFilters"></div>
    </div>

    <button class="clear-button" id="clearFilters">
      Clear Filters
    </button>
  </aside>

  <main>

    <div class="search-box">
      <span class="search-icon">&#9906;</span>
      <input
        id="search"
        type="search"
        placeholder="Search agencies, artists, specialties..."
        aria-label="Search resources"
      >
    </div>

    <div class="results-bar">
      <span id="resultCount">0 results</span>

      <select id="sort" aria-label="Sort results">
        <option value="az">Sort: A–Z</option>
        <option value="za">Sort: Z–A</option>
        <option value="location">Sort: Location</option>
      </select>
    </div>

    <div id="results"></div>

  </main>

</div>

<footer>
  Harper's Art Index — Editorial Research Directory
</footer>

<script>

/*
  GOOGLE SHEETS CONNECTION

  Publish each Google Sheets tab as a CSV:
  File > Share > Publish to web

  Select the individual tab and CSV format.

  Paste the resulting URL between the quotes below.

  Leave blank to use sample data.
*/

const CSV_URLS = {
  "Photo Agencies": "",
  "Illustration Agencies": "",
  "Publishers": "",
  "Archives": "",
  "Artists": ""
};

const categories = Object.keys(CSV_URLS);

/*
  SAMPLE DATA

  These records are examples.
  They are replaced for a category when its CSV loads.
*/

const sampleData = [
  {
    name: "Magnum Photos",
    website: "https://www.magnumphotos.com",
    specialty: "Documentary, News, Features",
    location: "International",
    description: "A photographer-owned cooperative representing documentary and editorial photographers.",
    category: "Photo Agencies"
  },
  {
    name: "VII Photo",
    website: "https://viiphoto.com",
    specialty: "News, Conflict, Documentary",
    location: "International",
    description: "An agency representing photojournalists working on global news and long-form stories.",
    category: "Photo Agencies"
  },
  {
    name: "Agence VU'",
    website: "https://agencevu.com",
    specialty: "Documentary, Portraiture, Features",
    location: "Paris, Europe",
    description: "A photography agency specializing in documentary and contemporary visual storytelling.",
    category: "Photo Agencies"
  },
  {
    name: "Panos Pictures",
    website: "https://www.panos.co.uk",
    specialty: "News, Features, Documentary",
    location: "London, Europe",
    description: "An independent photo agency focused on global news, culture, and social issues.",
    category: "Photo Agencies"
  },
  {
    name: "IllustrationX",
    website: "https://www.illustrationx.com",
    specialty: "Editorial, Illustration",
    location: "International",
    description: "An international illustration agency representing artists across a range of styles.",
    category: "Illustration Agencies"
  },
  {
    name: "Folio Art",
    website: "https://www.folioart.co.uk",
    specialty: "Editorial, Illustration",
    location: "London, Europe",
    description: "An illustration agency representing artists for editorial and commercial projects.",
    category: "Illustration Agencies"
  },
  {
    name: "Aperture",
    website: "https://aperture.org",
    specialty: "Photography, Publishing",
    location: "New York, North America",
    description: "A nonprofit publisher and organization dedicated to photography.",
    category: "Publishers"
  },
  {
    name: "MACK",
    website: "https://mackbooks.co.uk",
    specialty: "Photography, Publishing",
    location: "London, Europe",
    description: "An independent publisher of books on art, photography, and visual culture.",
    category: "Publishers"
  },
  {
    name: "Library of Congress",
    website: "https://www.loc.gov/pictures/",
    specialty: "Historical, Archival",
    location: "Washington, DC, North America",
    description: "A major collection of historical photographs, prints, and visual materials.",
    category: "Archives"
  }
];

let allData = [...sampleData];
let activeCategory = "Photo Agencies";
let selectedSpecialties = new Set();
let selectedLocations = new Set();

const navigation = document.getElementById("navigation");
const results = document.getElementById("results");
const searchInput = document.getElementById("search");
const sortInput = document.getElementById("sort");

function createNavigation() {
  navigation.replaceChildren();

  categories.forEach(category => {
    const button = document.createElement("button");
    button.textContent = category;
    button.className =
      category === activeCategory ? "active" : "";

    button.addEventListener("click", () => {
      activeCategory = category;
      selectedSpecialties.clear();
      selectedLocations.clear();
      createNavigation();
      createFilters();
      render();
    });

    navigation.appendChild(button);
  });
}

function splitValues(value) {
  return String(value || "")
    .split(",")
    .map(item => item.trim())
    .filter(Boolean);
}

function createFilters() {
  const categoryData = allData.filter(
    item => item.category === activeCategory
  );

  const specialties = [...new Set(
    categoryData.flatMap(item =>
      splitValues(item.specialty)
    )
  )].sort();

  const locations = [...new Set(
    categoryData.flatMap(item =>
      splitValues(item.location)
    )
  )].sort();

  buildCheckboxes(
    "specialtyFilters",
    specialties,
    selectedSpecialties
  );

  buildCheckboxes(
    "locationFilters",
    locations,
    selectedLocations
  );
}

function buildCheckboxes(containerId, values, selection) {
  const container = document.getElementById(containerId);
  container.replaceChildren();

  values.forEach(value => {
    const label = document.createElement("label");
    label.className = "filter-option";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = selection.has(value);

    checkbox.addEventListener("change", () => {
      if (checkbox.checked) {
        selection.add(value);
      } else {
        selection.delete(value);
      }
      render();
    });

    const text = document.createElement("span");
    text.textContent = value;

    label.append(checkbox, text);
    container.appendChild(label);
  });
}

function matchesSelection(value, selection) {
  if (selection.size === 0) return true;

  const values = splitValues(value);
  return [...selection].some(item => values.includes(item));
}

function safeWebsite(url) {
  try {
    const parsed = new URL(url);
    if (["http:", "https:"].includes(parsed.protocol)) {
      return parsed.href;
    }
  } catch (error) {}
  return "";
}

function render() {
  const query = searchInput.value.toLowerCase().trim();

  let filtered = allData.filter(item => {
    if (item.category !== activeCategory) return false;

    const searchable = [
      item.name,
      item.description,
      item.specialty,
      item.location,
      item.tags,
      item.notes
    ].join(" ").toLowerCase();

    return (
      searchable.includes(query) &&
      matchesSelection(item.specialty, selectedSpecialties) &&
      matchesSelection(item.location, selectedLocations)
    );
  });

  const sort = sortInput.value;

  filtered.sort((a, b) => {
    if (sort === "za") {
      return b.name.localeCompare(a.name);
    }

    if (sort === "location") {
      return a.location.localeCompare(b.location);
    }

    return a.name.localeCompare(b.name);
  });

  document.getElementById("resultCount").textContent =
    filtered.length + (
      filtered.length === 1 ? " result" : " results"
    );

  results.replaceChildren();

  if (filtered.length === 0) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No matching resources found.";
    results.appendChild(empty);
    return;
  }

  filtered.forEach(item => {
    const entry = document.createElement("article");
    entry.className = "entry";

    const content = document.createElement("div");

    const title = document.createElement("h2");
    const website = safeWebsite(item.website);

    if (website) {
      const titleLink = document.createElement("a");
      titleLink.href = website;
      titleLink.target = "_blank";
      titleLink.rel = "noopener noreferrer";
      titleLink.textContent = item.name;
      title.appendChild(titleLink);
    } else {
      title.textContent = item.name;
    }

    const type = document.createElement("div");
    type.className = "entry-type";
    type.textContent = item.category;

    const description = document.createElement("div");
    description.className = "entry-description";
    description.textContent = item.description;

    content.append(title, type, description);

    const meta = document.createElement("div");
    meta.className = "entry-meta";

    const location = document.createElement("div");
    location.textContent = item.location;

    const specialty = document.createElement("em");
    specialty.textContent = item.specialty;

    meta.append(location, specialty);

    const link = document.createElement("div");

    if (website) {
      const anchor = document.createElement("a");
      anchor.className = "entry-link";
      anchor.href = website;
      anchor.target = "_blank";
      anchor.rel = "noopener noreferrer";
      anchor.textContent = "↗";
      anchor.setAttribute(
        "aria-label", "Visit " + item.name
      );
      link.appendChild(anchor);
    }

    entry.append(content, meta, link);
    results.appendChild(entry);
  });
}

/*
  CSV PARSER

  Supports quoted values, commas inside fields,
  and line breaks inside quoted fields.
*/

function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = "";
  let quoted = false;

  for (let i = 0; i < text.length; i++) {
    const char = text[i];

    if (char === '"') {
      if (quoted && text[i + 1] === '"') {
        field += '"';
        i++;
      } else {
        quoted = !quoted;
      }
    } else if (char === "," && !quoted) {
      row.push(field);
      field = "";
    } else if (
      (char === "\n" || char === "\r") &&
      !quoted
    ) {
      if (char === "\r" && text[i + 1] === "\n") i++;

      row.push(field);
      if (row.some(value => value.trim())) rows.push(row);
      row = [];
      field = "";
    } else {
      field += char;
    }
  }

  row.push(field);
  if (row.some(value => value.trim())) rows.push(row);

  return rows;
}

function csvToObjects(text, category) {
  const rows = parseCSV(text);
  if (rows.length < 2) return [];

  const headers = rows.shift().map(
    heading => heading.trim().toLowerCase()
  );

  return rows.map(row => {
    const record = {};

    headers.forEach((heading, index) => {
      record[heading] = (row[index] || "").trim();
    });

    return {
      name: record.name || "",
      website: record.website || "",
      specialty: record.specialty || "",
      location: record.location || "",
      description: record.description || "",
      contact: record.contact || "",
      tags: record.tags || "",
      notes: record.notes || "",
      category
    };
  }).filter(item => item.name);
}

async function loadSheets() {
  for (const [category, url] of Object.entries(CSV_URLS)) {
    if (!url.trim()) continue;

    try {
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const csv = await response.text();
      const records = csvToObjects(csv, category);

      allData = allData.filter(
        item => item.category !== category
      );

      allData.push(...records);

    } catch (error) {
      console.error(
        "Could not load " + category + ":",
        error
      );
    }
  }

  createFilters();
  render();
}

document.getElementById("clearFilters")
  .addEventListener("click", () => {
    selectedSpecialties.clear();
    selectedLocations.clear();
    createFilters();
    render();
  });

searchInput.addEventListener("input", render);
sortInput.addEventListener("change", render);

createNavigation();
createFilters();
render();
loadSheets();

</script>
</body>
</html>
