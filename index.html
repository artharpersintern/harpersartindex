
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harper's Art Index</title>

<style>
:root {
  --paper: #faf8f3;
  --ink: #171717;
  --muted: #68655f;
  --line: #c8c4bd;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: Georgia, "Times New Roman", serif;
}

button, input, select { font: inherit; }
button { cursor: pointer; }

/* HEADER */

header { padding: 28px 4% 0; }

.header-inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 35px;
  border-bottom: 1px solid var(--ink);
  padding-bottom: 26px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 25px;
  white-space: nowrap;
}

.logo {
  font-size: 33px;
  font-weight: bold;
  letter-spacing: -1.5px;
}

.brand-divider {
  height: 38px;
  border-left: 1px solid var(--ink);
}

.brand-subtitle {
  font-size: 29px;
  font-style: italic;
}

nav {
  display: flex;
  gap: 27px;
  flex-wrap: wrap;
}

nav button {
  border: 0;
  border-bottom: 2px solid transparent;
  background: transparent;
  padding: 12px 0;
  font-size: 16px;
  color: var(--ink);
}

nav button.active {
  border-bottom-color: var(--ink);
}

nav button:hover { opacity: .6; }

/* PAGE LAYOUT */

.layout {
  display: grid;
  grid-template-columns: 235px minmax(0, 1fr);
  gap: 45px;
  padding: 50px 4%;
  max-width: 1800px;
  margin: auto;
}

main { min-width: 0; }

/* FILTER SIDEBAR */

aside {
  border-right: 1px solid var(--line);
  padding-right: 30px;
}

aside h2 {
  font-size: 24px;
  font-weight: normal;
  margin: 0 0 18px;
}

.filter-group {
  border-top: 1px solid var(--line);
  padding: 12px 0;
}

.filter-group summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  list-style: none;
  font-size: 12px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 4px 0 10px;
}

.filter-group summary::-webkit-details-marker {
  display: none;
}

.filter-group summary::after {
  content: "+";
  font-size: 17px;
  font-weight: normal;
}

.filter-group[open] summary::after {
  content: "−";
}

.filter-options {
  max-height: 350px;
  overflow-y: auto;
  padding-right: 5px;
}

.filter-option {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 8px 0;
  font-size: 13px;
  cursor: pointer;
}

.filter-option input {
  accent-color: var(--ink);
  width: 14px;
  height: 14px;
  flex-shrink: 0;
}

.clear-button {
  border: 1px solid var(--ink);
  background: transparent;
  padding: 9px 12px;
  width: 100%;
  margin-top: 15px;
  font-size: 12px;
}

.clear-button:hover {
  background: var(--ink);
  color: var(--paper);
}

/* SEARCH */

.search-box {
  display: flex;
  align-items: center;
  border: 1px solid var(--ink);
  padding: 0 20px;
  height: 66px;
  gap: 15px;
}

.search-icon {
  font-size: 27px;
  line-height: 1;
}

.search-box input {
  flex: 1;
  min-width: 0;
  border: 0;
  outline: none;
  background: transparent;
  font-size: 21px;
  font-style: italic;
  color: var(--ink);
}

.status {
  margin-top: 12px;
  color: var(--muted);
  font-size: 13px;
}

.status:empty { display: none; }

/* RESULTS HEADER */

.results-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 30px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--ink);
  gap: 15px;
  font-size: 14px;
}

.results-bar select {
  border: 0;
  background: transparent;
  font-size: 14px;
  color: var(--ink);
  cursor: pointer;
}

/* COMPACT DIRECTORY ENTRIES */

.entry {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 170px 25px;
  align-items: center;
  gap: 22px;
  padding: 13px 0;
  min-height: 55px;
  border-bottom: 1px solid var(--line);
  transition: background .15s ease;
}

.entry:hover {
  background: rgba(0, 0, 0, .025);
}

.entry h2 {
  font-size: 23px;
  font-weight: normal;
  line-height: 1.2;
  letter-spacing: -.3px;
  margin: 0;
}

.entry h2 a {
  color: inherit;
  text-decoration: none;
}

.entry h2 a:hover {
  opacity: .55;
}

.entry-meta {
  font-size: 13px;
  line-height: 1.3;
  color: var(--muted);
}

.entry-link {
  color: var(--ink);
  font-size: 20px;
  text-decoration: none;
  text-align: right;
  display: block;
}

.entry-link:hover { opacity: .55; }

.empty {
  padding: 35px 0;
  color: var(--muted);
  font-size: 15px;
}

footer {
  padding: 25px 4%;
  border-top: 1px solid var(--line);
  color: var(--muted);
  font-size: 12px;
}

/* RESPONSIVE */

@media (max-width: 1050px) {
  .header-inner {
    align-items: flex-start;
    flex-direction: column;
  }

  .layout {
    grid-template-columns: 190px minmax(0, 1fr);
    gap: 25px;
  }
}

@media (max-width: 700px) {
  header { padding-top: 20px; }

  .header-inner { gap: 15px; }

  .brand { gap: 12px; }
  .logo { font-size: 25px; }
  .brand-subtitle { font-size: 23px; }

  nav {
    gap: 16px;
  }

  nav button {
    font-size: 13px;
    padding: 9px 0;
  }

  .layout {
    display: block;
    padding-top: 30px;
  }

  aside {
    border-right: 0;
    border-bottom: 1px solid var(--line);
    padding: 0 0 20px;
    margin-bottom: 25px;
  }

  .filter-options { max-height: 180px; }

  .search-box { height: 58px; }

  .search-box input { font-size: 16px; }

  .entry {
    grid-template-columns: minmax(0, 1fr) 90px 20px;
    gap: 10px;
    padding: 12px 0;
    min-height: 50px;
  }

  .entry h2 { font-size: 18px; }

  .entry-meta { font-size: 11px; }

  .entry-link { font-size: 17px; }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">
    <div class="brand">
      <div class="logo">HARPER'S</div>
      <div class="brand-divider"></div>
      <div class="brand-subtitle">Art Index</div>
    </div>
    <nav id="navigation" aria-label="Resource categories"></nav>
  </div>
</header>

<div class="layout">

  <aside>
    <h2>Filters</h2>

    <details class="filter-group" open>
      <summary>Specialty</summary>
      <div class="filter-options" id="specialtyFilters"></div>
    </details>

    <details class="filter-group">
      <summary>Location</summary>
      <div class="filter-options" id="locationFilters"></div>
    </details>

    <button class="clear-button" id="clearFilters">
      Clear Filters
    </button>
  </aside>

  <main>

    <div class="search-box">
      <span class="search-icon" aria-hidden="true">&#9906;</span>
      <input
        id="search"
        type="search"
        placeholder="Search agencies, artists, specialties..."
        aria-label="Search resources"
      >
    </div>

    <div class="status" id="status" role="status">
      Loading directory...
    </div>

    <div class="results-bar">
      <span id="resultCount">0 results</span>

      <select id="sort" aria-label="Sort results">
        <option value="az">Sort: A–Z</option>
        <option value="za">Sort: Z–A</option>
        <option value="location">Sort: Location</option>
      </select>
    </div>

    <div id="results"></div>

  </main>
</div>

<footer>
  Harper's Art Index — Editorial Research Directory
</footer>

<script>

// ==========================================
// GOOGLE SHEETS CONNECTIONS
// ==========================================

const SHEET_ID =
  "2PACX-1vS4gQxnhzjt5h6Qxk9EVbP71FvFY336JQMdJvp6pnjgsZGEEn4esrvDaeOUk_ihm0fVojdMNyfN5yP8";

const BASE_URL =
  "https://docs.google.com/spreadsheets/d/e/" +
  SHEET_ID + "/pub?single=true&output=csv&gid=";

const CSV_URLS = {
  "Photo Agencies": BASE_URL + "0",
  "Illustration Agencies": BASE_URL + "1117426325",
  "Publishers": BASE_URL + "1313430076",
  "Archives": BASE_URL + "1061277045",
  "Artists": BASE_URL + "1721219062"
};

// ==========================================
// STATE AND ELEMENTS
// ==========================================

const categories = Object.keys(CSV_URLS);

let allData = [];
let activeCategory = "Photo Agencies";
let selectedSpecialties = new Set();
let selectedLocations = new Set();

const navigation = document.getElementById("navigation");
const results = document.getElementById("results");
const searchInput = document.getElementById("search");
const sortInput = document.getElementById("sort");
const resultCount = document.getElementById("resultCount");
const statusElement = document.getElementById("status");

// ==========================================
// CSV PARSING
// ==========================================

function parseCSV(text) {
  const rows = [];
  let row = [];
  let field = "";
  let quoted = false;

  text = text.replace(/^\uFEFF/, "");

  for (let i = 0; i < text.length; i++) {
    const char = text[i];

    if (char === '"') {
      if (quoted && text[i + 1] === '"') {
        field += '"';
        i++;
      } else {
        quoted = !quoted;
      }
    } else if (char === "," && !quoted) {
      row.push(field);
      field = "";
    } else if (
      (char === "\n" || char === "\r") && !quoted
    ) {
      if (char === "\r" && text[i + 1] === "\n") i++;

      row.push(field);

      if (row.some(cell => cell.trim())) {
        rows.push(row);
      }

      row = [];
      field = "";
    } else {
      field += char;
    }
  }

  row.push(field);

  if (row.some(cell => cell.trim())) {
    rows.push(row);
  }

  return rows;
}

function csvToObjects(text, category) {
  const rows = parseCSV(text);

  if (!rows.length) {
    throw new Error("CSV is empty");
  }

  const headers = rows.shift().map(
    heading => heading.trim().toLowerCase()
  );

  if (!headers.includes("name")) {
    throw new Error("CSV must contain a Name column");
  }

  return rows.map(row => {
    const record = {};

    headers.forEach((heading, index) => {
      record[heading] = (row[index] || "").trim();
    });

    return {
      name: record.name || "",
      website: record.website || "",
      specialty: record.specialty || "",
      location: record.location || "",
      description: record.description || "",
      contact: record.contact || "",
      tags: record.tags || "",
      notes: record.notes || "",
      category
    };
  }).filter(item => item.name);
}

// ==========================================
// LOAD GOOGLE SHEETS
// ==========================================

async function loadSheets() {
  statusElement.textContent = "Loading directory...";

  const requests = categories.map(async category => {
    try {
      const response = await fetch(CSV_URLS[category], {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const text = await response.text();

      return {
        category,
        records: csvToObjects(text, category),
        error: null
      };
    } catch (error) {
      console.error(category, error);

      return {
        category,
        records: [],
        error: error.message
      };
    }
  });

  const loaded = await Promise.all(requests);

  allData = loaded.flatMap(item => item.records);

  const failures = loaded.filter(item => item.error);

  statusElement.textContent = failures.length
    ? "Unable to load: " +
      failures.map(item => item.category).join(", ")
    : "";

  createFilters();
  render();
}

// ==========================================
// NAVIGATION
// ==========================================

function createNavigation() {
  navigation.replaceChildren();

  categories.forEach(category => {
    const button = document.createElement("button");

    button.textContent = category;
    button.className =
      category === activeCategory ? "active" : "";

    button.setAttribute(
      "aria-pressed",
      String(category === activeCategory)
    );

    button.addEventListener("click", () => {
      activeCategory = category;

      selectedSpecialties.clear();
      selectedLocations.clear();

      createNavigation();
      createFilters();
      render();
    });

    navigation.appendChild(button);
  });
}

// ==========================================
// FILTERS
// ==========================================

function splitValues(value) {
  return String(value || "")
    .split(",")
    .map(item => item.trim())
    .filter(Boolean);
}

function createFilters() {
  const categoryData = allData.filter(
    item => item.category === activeCategory
  );

  const specialties = [...new Set(
    categoryData.flatMap(item =>
      splitValues(item.specialty)
    )
  )].sort();

  const locations = [...new Set(
    categoryData.flatMap(item =>
      splitValues(item.location)
    )
  )].sort();

  buildCheckboxes(
    "specialtyFilters",
    specialties,
    selectedSpecialties
  );

  buildCheckboxes(
    "locationFilters",
    locations,
    selectedLocations
  );
}

function buildCheckboxes(containerId, values, selection) {
  const container = document.getElementById(containerId);
  container.replaceChildren();

  values.forEach(value => {
    const label = document.createElement("label");
    label.className = "filter-option";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = selection.has(value);

    checkbox.addEventListener("change", () => {
      if (checkbox.checked) {
        selection.add(value);
      } else {
        selection.delete(value);
      }

      render();
    });

    const text = document.createElement("span");
    text.textContent = value;

    label.append(checkbox, text);
    container.appendChild(label);
  });
}

function matchesSelection(value, selection) {
  if (selection.size === 0) return true;

  const values = splitValues(value);

  return [...selection].some(item =>
    values.includes(item)
  );
}

// ==========================================
// SAFE WEBSITE LINKS
// ==========================================

function safeWebsite(url) {
  if (!url) return "";

  try {
    const normalized = /^https?:\/\//i.test(url)
      ? url
      : "https://" + url;

    const parsed = new URL(normalized);

    if (
      parsed.protocol === "http:" ||
      parsed.protocol === "https:"
    ) {
      return parsed.href;
    }
  } catch (error) {}

  return "";
}

// ==========================================
// COMPACT DIRECTORY RESULTS
// ==========================================

function render() {
  const query = searchInput.value.toLowerCase().trim();

  let filtered = allData.filter(item => {
    if (item.category !== activeCategory) {
      return false;
    }

    // Search all descriptive fields even though
    // they are not shown in the directory rows.
    const searchable = [
      item.name,
      item.description,
      item.specialty,
      item.location,
      item.tags,
      item.notes
    ].join(" ").toLowerCase();

    return (
      searchable.includes(query) &&
      matchesSelection(
        item.specialty,
        selectedSpecialties
      ) &&
      matchesSelection(
        item.location,
        selectedLocations
      )
    );
  });

  const sort = sortInput.value;

  filtered.sort((a, b) => {
    if (sort === "za") {
      return b.name.localeCompare(a.name);
    }

    if (sort === "location") {
      return a.location.localeCompare(b.location) ||
             a.name.localeCompare(b.name);
    }

    return a.name.localeCompare(b.name);
  });

  resultCount.textContent =
    filtered.length +
    (filtered.length === 1 ? " result" : " results");

  results.replaceChildren();

  if (!filtered.length) {
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No matching resources found.";
    results.appendChild(empty);
    return;
  }

  filtered.forEach(item => {
    const entry = document.createElement("article");
    entry.className = "entry";

    // NAME
    const title = document.createElement("h2");
    const website = safeWebsite(item.website);

    if (website) {
      const titleLink = document.createElement("a");
      titleLink.href = website;
      titleLink.target = "_blank";
      titleLink.rel = "noopener noreferrer";
      titleLink.textContent = item.name;
      title.appendChild(titleLink);
    } else {
      title.textContent = item.name;
    }

    // LOCATION
    const meta = document.createElement("div");
    meta.className = "entry-meta";
    meta.textContent = item.location;

    // EXTERNAL LINK
    const linkContainer = document.createElement("div");

    if (website) {
      const link = document.createElement("a");
      link.className = "entry-link";
      link.href = website;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.textContent = "↗";
      link.setAttribute(
        "aria-label",
        "Visit " + item.name
      );
      linkContainer.appendChild(link);
    }

    entry.append(title, meta, linkContainer);
    results.appendChild(entry);
  });
}

// ==========================================
// EVENT LISTENERS
// ==========================================

document.getElementById("clearFilters")
  .addEventListener("click", () => {
    selectedSpecialties.clear();
    selectedLocations.clear();

    createFilters();
    render();
  });

searchInput.addEventListener("input", render);
sortInput.addEventListener("change", render);

// ==========================================
// INITIALIZE
// ==========================================

createNavigation();
createFilters();
render();
loadSheets();

</script>

</body>
</html>
